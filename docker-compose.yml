services:
  mysql:
    image: mysql:8.0
    container_name: payroll_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: payroll
      MYSQL_USER: payroll
      MYSQL_PASSWORD: payroll123
      TZ: Asia/Bangkok
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    ports:
      # host 3316 -> container 3306 (เลี่ยงชนกับ MySQL ตัวอื่นที่ใช้ 3306-3310)
      - "3316:3306"
    volumes:
      - payroll_mysql_data:/var/lib/mysql
      # schema เริ่มต้น (รันครั้งแรกที่ volume ยังว่าง)
      - ./backend/src/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-prootpassword"]
      interval: 5s
      timeout: 5s
      retries: 20

  adminer:
    image: adminer:4
    container_name: payroll_adminer
    restart: unless-stopped
    depends_on:
      - mysql
    ports:
      - "8081:8080"
    environment:
      ADMINER_DEFAULT_SERVER: mysql

volumes:
  payroll_mysql_data:
